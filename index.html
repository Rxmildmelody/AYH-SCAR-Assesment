<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบประเมินอาการแพ้ยา (SCARs)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; background-color: #f1f5f9; }
        .step-container { display: none; }
        .step-active { display: block; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        input[type="file"] { display: none; }
        /* แอนิเมชันแถบโหลด */
        .progress-stripe {
            background-image: linear-gradient(45deg, rgba(255,255,255,0.15) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.15) 50%, rgba(255,255,255,0.15) 75%, transparent 75%, transparent);
            background-size: 1rem 1rem;
            animation: stripe-motion 1s linear infinite;
        }
        @keyframes stripe-motion { 0% { background-position: 1rem 0; } 100% { background-position: 0 0; } }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- 🌟 หน้าจอ Loading (จะโชว์ตอนกดส่งข้อมูล) 🌟 -->
    <div id="loadingOverlay" class="fixed inset-0 bg-slate-900/80 z-50 hidden flex-col items-center justify-center p-6 backdrop-blur-sm">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-sm text-center">
            <i id="loadingIcon" class="fa-solid fa-cloud-arrow-up text-5xl text-blue-500 mb-4 animate-bounce"></i>
            <h3 class="text-xl font-bold text-slate-800 mb-2" id="loadingTitle">กำลังส่งข้อมูล...</h3>
            <p class="text-sm text-slate-500 mb-6" id="loadingDesc">กรุณาอย่าปิดหน้าต่างหรือพักหน้าจอ</p>
            
            <div class="w-full bg-slate-100 rounded-full h-4 mb-2 overflow-hidden border border-slate-200">
                <div id="uploadProgress" class="bg-blue-600 h-4 rounded-full transition-all duration-300 relative progress-stripe" style="width: 0%"></div>
            </div>
            <p class="text-right text-sm font-bold text-blue-700" id="uploadText">0%</p>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-blue-700 text-white p-4 shadow-md flex items-center justify-between z-10 shrink-0">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-notes-medical text-2xl"></i>
            <div>
                <h1 class="text-lg font-bold leading-tight">แบบประเมินอาการแพ้ยา</h1>
                <p class="text-xs text-blue-200" id="displayHN">HN: กำลังโหลด...</p>
            </div>
        </div>
        <img id="userImage" src="https://via.placeholder.com/150" alt="Profile" class="w-10 h-10 rounded-full border-2 border-white hidden">
    </header>

    <!-- Progress Bar ของแบบประเมิน -->
    <div class="bg-white h-2 w-full">
        <div id="progressBar" class="bg-green-500 h-full w-0 transition-all duration-300"></div>
    </div>

    <!-- Content Area -->
    <main class="flex-1 overflow-y-auto p-4 flex flex-col justify-center">
        
        <!-- Step 0: หน้าเริ่มต้อนรับ -->
        <div id="step-0" class="step-container step-active text-center bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <div class="w-20 h-20 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-4xl mx-auto mb-4">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-800 mb-2">สวัสดีครับ/ค่ะ <br><span id="userName" class="text-blue-600">คุณ...</span></h2>
            <p class="text-slate-600 mb-6 text-lg">แบบประเมินนี้มีทั้งหมด 4 ข้อ<br>เพื่อความปลอดภัยในการใช้ยาของท่าน</p>
            <button onclick="nextStep()" class="w-full bg-blue-600 text-white text-xl font-bold py-4 rounded-xl shadow-md hover:bg-blue-700 transition">
                เริ่มทำแบบประเมิน <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
        </div>

        <!-- กล่องคำถามถูกสร้างด้วย JavaScript -->
        <div id="questionsContainer"></div>

        <!-- Step 5: หน้ากดยืนยันการส่ง -->
        <div id="step-final" class="step-container text-center bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <div class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center text-4xl mx-auto mb-4">
                <i class="fa-solid fa-clipboard-check"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-800 mb-2">ทำแบบประเมินครบแล้ว</h2>
            <p class="text-slate-600 mb-6 text-lg">กรุณากดปุ่มด้านล่างเพื่อประมวลผลอาการของท่าน</p>
            <button id="submitBtn" onclick="submitAssessment()" class="w-full bg-green-600 text-white text-xl font-bold py-4 rounded-xl shadow-md hover:bg-green-700 transition mb-3">
                <i class="fa-solid fa-paper-plane mr-2"></i> ส่งข้อมูล (อัปโหลดรูป)
            </button>
            <button onclick="prevStep()" class="w-full bg-slate-200 text-slate-700 text-lg font-bold py-3 rounded-xl hover:bg-slate-300 transition">
                กลับไปแก้ไข
            </button>
        </div>

        <!-- Step 6: หน้าแสดงผลลัพธ์ (จะแสดงหลังอัปโหลดเสร็จ) -->
        <div id="step-result" class="step-container text-center bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <!-- ข้อมูลจะถูกแทรกด้วย JavaScript -->
        </div>

    </main>

    <script>
        // ==========================================
        // ⚠️ การตั้งค่า URL
        // ==========================================
        const MY_LIFF_ID = "2010995687-3szXwNXK"; 
        const GOOGLE_APP_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzBDF7UHDU6o9ZgRm2Pj-vCXsdjgX_0RLOXBpPv4AaPKSwQuuDSOO9Vk3pog2LS866x/exec'; // ใส่ URL ของ Web App ตรงนี้

        let currentStep = 0;
        let patientHN = "ไม่ระบุ";
        
        const questions = [
            { id: "symp1", text: "1. ท่านมีไข้สูง ปวดเมื่อยตามตัว อ่อนเพลีย อาการคล้ายไข้หวัด หรือไม่?" },
            { id: "symp2", text: "2. ท่านมีอาการเจ็บในปาก ในลำคอ มีแผลตามเยื่อบุต่างๆ เช่น หู ตา จมูก ปาก ทวารหนัก หรือไม่?" },
            { id: "symp3", text: "3. ท่านมีผื่นนูน/ราบแดงตามลำตัว แขน ขา หรือมีผิวหนังลอกเป็นแผ่น เป็นขุย หรือไม่?" },
            { id: "symp4", text: "4. ท่านมีอาการเจ็บตา เยื่อบุตาแดง ตาบวม หรือไม่?" }
        ];

        let answers = { symp1: '', symp2: '', symp3: '', symp4: '' };
        let photos = { symp1: '', symp2: '', symp3: '', symp4: '' }; 

        function buildQuestionsUI() {
            const container = document.getElementById('questionsContainer');
            
            questions.forEach((q, index) => {
                const stepNum = index + 1;
                const requiresPhoto = (stepNum !== 1); // ข้อ 1 ไม่ต้องใช้รูป
                
                let photoSectionHTML = '';
                if (requiresPhoto) {
                    photoSectionHTML = `
                    <div id="photo-section-${stepNum}" class="hidden mb-6 p-4 bg-orange-50 rounded-xl border border-orange-200 text-center">
                        <p class="text-orange-800 font-bold mb-2"><i class="fa-solid fa-camera text-xl mr-1"></i> กรุณาถ่ายรูปอาการของท่าน</p>
                        <p class="text-sm text-orange-600 mb-4">เพื่อส่งให้เภสัชกรประเมินความปลอดภัย</p>
                        
                        <label class="cursor-pointer bg-orange-500 hover:bg-orange-600 text-white py-3 px-6 rounded-xl font-bold inline-block shadow-sm">
                            <i class="fa-solid fa-camera-retro mr-1"></i> ถ่ายรูป / เลือกรูป
                            <input type="file" accept="image/*" capture="environment" onchange="handlePhotoUpload(event, ${stepNum})">
                        </label>
                        
                        <div id="preview-container-${stepNum}" class="mt-4 hidden relative">
                            <img id="preview-img-${stepNum}" src="" class="w-full max-h-48 object-cover rounded-lg border-2 border-orange-300">
                            <button onclick="removePhoto(${stepNum})" class="absolute top-2 right-2 bg-red-600 text-white w-8 h-8 rounded-full shadow-md"><i class="fa-solid fa-trash"></i></button>
                        </div>
                        <p id="photo-warning-${stepNum}" class="text-red-500 font-bold text-sm mt-3 hidden">⚠️ ต้องแนบรูปภาพก่อนไปข้อต่อไป</p>
                    </div>`;
                }

                // สังเกตตรงนี้ครับ เอาโค้ดกล่องข้อความมาใส่ในตัวแปร HTML เรียบร้อย
                const html = `
                <div id="step-${stepNum}" class="step-container bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <p class="text-sm font-bold text-blue-600 mb-2">ข้อที่ ${stepNum} จาก ${questions.length}</p>
                    <h3 class="text-xl font-bold text-slate-800 mb-6 leading-relaxed">${q.text}</h3>
                    
                    <div class="space-y-4 mb-6">
                        <button onclick="selectAnswer(${stepNum}, 'no')" id="btn-no-${stepNum}" class="w-full flex items-center justify-between p-4 rounded-xl border-2 border-slate-200 hover:border-green-500 hover:bg-green-50 transition">
                            <span class="text-xl font-bold text-slate-700"><i class="fa-solid fa-face-smile text-green-500 mr-2"></i> ไม่มีอาการ</span>
                            <i id="check-no-${stepNum}" class="fa-solid fa-circle-check text-2xl text-green-500 hidden"></i>
                        </button>
                        <button onclick="selectAnswer(${stepNum}, 'yes')" id="btn-yes-${stepNum}" class="w-full flex items-center justify-between p-4 rounded-xl border-2 border-slate-200 hover:border-red-500 hover:bg-red-50 transition">
                            <span class="text-xl font-bold text-slate-700"><i class="fa-solid fa-face-frown text-red-500 mr-2"></i> มีอาการ</span>
                            <i id="check-yes-${stepNum}" class="fa-solid fa-circle-check text-2xl text-red-500 hidden"></i>
                        </button>
                    </div>

                    ${photoSectionHTML}

                    <!-- ช่องกรอกอาการเพิ่มเติม -->
                    <div class="mt-4 mb-4">
                        <label class="block text-sm font-bold text-slate-600 mb-2">ระบุอาการเพิ่มเติม (ถ้ามี):</label>
                        <textarea id="extra-symp-${stepNum}" rows="2" placeholder="เช่น คันตามตัว, หน้ามืด..." class="w-full p-3 border-2 border-slate-200 rounded-xl focus:border-blue-500 focus:outline-none transition"></textarea>
                    </div>

                    <div class="flex gap-3 mt-8">
                        <button onclick="prevStep()" class="flex-1 bg-slate-200 text-slate-700 text-lg font-bold py-3 rounded-xl"><i class="fa-solid fa-arrow-left"></i> กลับ</button>
                        <button onclick="nextStep()" class="flex-1 bg-blue-600 text-white text-lg font-bold py-3 rounded-xl shadow-md">ถัดไป <i class="fa-solid fa-arrow-right"></i></button>
                    </div>
                </div>
                `;
                container.innerHTML += html;
            });
        }

        function updateUI() {
            document.querySelectorAll('.step-container').forEach((el, idx) => {
                el.classList.remove('step-active');
                if(idx === currentStep) el.classList.add('step-active');
            });
            const maxProgressSteps = questions.length + 1; 
            const progress = Math.min((currentStep / maxProgressSteps) * 100, 100);
            document.getElementById('progressBar').style.width = `${progress}%`;
        }

        function nextStep() {
            if (currentStep >= 1 && currentStep <= 4) {
                const qId = questions[currentStep - 1].id;
                const ans = answers[qId];
                if (!ans) { alert("กรุณาเลือกคำตอบก่อนไปข้อถัดไปครับ"); return; }
                if (ans === 'yes' && currentStep !== 1 && !photos[qId]) {
                    document.getElementById(`photo-warning-${currentStep}`).classList.remove('hidden');
                    return;
                }
            }
            if(currentStep < questions.length + 1) { currentStep++; updateUI(); }
        }

        function prevStep() { if(currentStep > 0) { currentStep--; updateUI(); } }

        function selectAnswer(stepNum, answer) {
            const qId = questions[stepNum - 1].id;
            answers[qId] = answer;

            document.getElementById(`btn-no-${stepNum}`).classList.replace('border-green-500', 'border-slate-200');
            document.getElementById(`btn-no-${stepNum}`).classList.remove('bg-green-50');
            document.getElementById(`check-no-${stepNum}`).classList.add('hidden');
            document.getElementById(`btn-yes-${stepNum}`).classList.replace('border-red-500', 'border-slate-200');
            document.getElementById(`btn-yes-${stepNum}`).classList.remove('bg-red-50');
            document.getElementById(`check-yes-${stepNum}`).classList.add('hidden');

            const photoSection = document.getElementById(`photo-section-${stepNum}`);
            const photoWarning = document.getElementById(`photo-warning-${stepNum}`);

            if (answer === 'no') {
                document.getElementById(`btn-no-${stepNum}`).classList.replace('border-slate-200', 'border-green-500');
                document.getElementById(`btn-no-${stepNum}`).classList.add('bg-green-50');
                document.getElementById(`check-no-${stepNum}`).classList.remove('hidden');
                
                if(photoSection) {
                    photoSection.classList.add('hidden');
                    photoWarning.classList.add('hidden');
                    photos[qId] = ''; 
                }
            } else {
                document.getElementById(`btn-yes-${stepNum}`).classList.replace('border-slate-200', 'border-red-500');
                document.getElementById(`btn-yes-${stepNum}`).classList.add('bg-red-50');
                document.getElementById(`check-yes-${stepNum}`).classList.remove('hidden');
                
                if(photoSection) photoSection.classList.remove('hidden');
            }
        }

        // ==========================================
        // 🌟 ฟังก์ชันบีบอัดรูปก่อนส่ง (กันค้าง) 🌟
        // ==========================================
        function handlePhotoUpload(event, stepNum) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800; // ย่อขนาดความกว้างให้เหลือไม่เกิน 800px
                    let scaleSize = MAX_WIDTH / img.width;
                    if(scaleSize > 1) scaleSize = 1; 

                    canvas.width = img.width * scaleSize;
                    canvas.height = img.height * scaleSize;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    // บีบอัดคุณภาพเหลือ 70% ทำให้ส่งเร็วขึ้นมาก
                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);

                    const qId = questions[stepNum - 1].id;
                    photos[qId] = compressedBase64; 
                    
                    document.getElementById(`preview-img-${stepNum}`).src = compressedBase64;
                    document.getElementById(`preview-container-${stepNum}`).classList.remove('hidden');
                    document.getElementById(`photo-warning-${stepNum}`).classList.add('hidden');
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function removePhoto(stepNum) {
            const qId = questions[stepNum - 1].id;
            photos[qId] = ''; 
            document.getElementById(`preview-container-${stepNum}`).classList.add('hidden');
            document.getElementById(`preview-img-${stepNum}`).src = '';
            const fileInput = document.querySelector(`#photo-section-${stepNum} input[type=file]`);
            if(fileInput) fileInput.value = "";
        }

        // ==========================================
        // 4. ส่งข้อมูลและการแสดงหน้า Loading
        // ==========================================
        async function submitAssessment() {
            let yesCount = 0;
            if (answers.symp1 === 'yes') yesCount++;
            if (answers.symp2 === 'yes') yesCount++;
            if (answers.symp3 === 'yes') yesCount++;
            if (answers.symp4 === 'yes') yesCount++;

            const isRisk = (yesCount >= 1) ? "เสี่ยงสูง" : "ปกติ";

            // รวบรวมข้อความอาการเพิ่มเติมทั้งหมดที่คนไข้พิมพ์มา (จากทั้ง 4 ข้อ) 
            let extraText = [];
            for(let i=1; i<=4; i++) {
                const input = document.getElementById(`extra-symp-${i}`);
                if(input && input.value.trim() !== '') {
                    extraText.push(`ข้อ ${i}: ${input.value.trim()}`);
                }
            }
            const finalExtraText = extraText.length > 0 ? extraText.join(' | ') : "-";

            const payload = {
                action: 'submit_assessment',
                hn: patientHN,
                symp1: answers.symp1, symp2: answers.symp2, symp3: answers.symp3, symp4: answers.symp4,
                photo2: photos.symp2, photo3: photos.symp3, photo4: photos.symp4,
                extraSymp: finalExtraText,
                risk: isRisk
            };

            // 1. เปิดหน้าจอ Loading
            const overlay = document.getElementById('loadingOverlay');
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
            
            // 2. จำลองตัวเลขเปอร์เซ็นต์ให้วิ่งระหว่างรอส่งข้อมูลไป Google
            let progress = 0;
            const progressText = document.getElementById('uploadText');
            const progressBar = document.getElementById('uploadProgress');
            
            // วิ่งขึ้นไปถึง 90% (เหลือ 10% ไว้ตอนมันโหลดเสร็จจริงๆ)
            const interval = setInterval(() => {
                if (progress < 90) {
                    progress += Math.floor(Math.random() * 5) + 1; 
                    if(progress > 90) progress = 90;
                    progressBar.style.width = `${progress}%`;
                    progressText.innerText = `${progress}%`;
                    
                    if(progress > 50) {
                        document.getElementById('loadingTitle').innerText = 'กำลังประมวลผลรูปภาพ...';
                    }
                }
            }, 300);

            try {
                // 3. ส่งข้อมูลจริง
                await fetch(GOOGLE_APP_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(payload),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                
                // 4. ถ้าส่งเสร็จ เคลียร์ % ให้วิ่งเต็ม 100
                clearInterval(interval);
                progressBar.style.width = '100%';
                progressText.innerText = '100%';
                
                document.getElementById('loadingTitle').innerText = 'บันทึกสำเร็จ!';
                document.getElementById('loadingTitle').classList.replace('text-slate-800', 'text-green-600');
                document.getElementById('loadingIcon').classList.replace('fa-cloud-arrow-up', 'fa-circle-check');
                document.getElementById('loadingIcon').classList.replace('text-blue-500', 'text-green-500');
                document.getElementById('loadingIcon').classList.remove('animate-bounce');

                // รอ 1 วินาทีให้คนไข้เห็นคำว่าสำเร็จ แล้วค่อยสลับไปหน้าสรุป
                setTimeout(() => {
                    overlay.classList.add('hidden');
                    overlay.classList.remove('flex');
                    showResultScreen(isRisk);
                }, 1000);

            } catch (error) {
                clearInterval(interval);
                overlay.classList.add('hidden');
                overlay.classList.remove('flex');
                alert('เกิดข้อผิดพลาดในการเชื่อมต่ออินเทอร์เน็ต กรุณาลองใหม่อีกครั้ง');
            }
        }

        function showResultScreen(riskLevel) {
            document.getElementById('step-final').classList.remove('step-active');
            const resultDiv = document.getElementById('step-result');
            
            if (riskLevel === "เสี่ยงสูง") {
                resultDiv.innerHTML = `
                    <div class="w-24 h-24 bg-red-100 text-red-600 rounded-full flex items-center justify-center text-5xl mx-auto mb-6 shadow-sm border-4 border-red-200">
                        <i class="fa-solid fa-triangle-exclamation animate-pulse"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-red-600 mb-4">โปรดระวังอาการแพ้ยา</h2>
                    <div class="text-slate-700 mb-6 text-lg text-left bg-red-50 p-5 rounded-xl border border-red-200 shadow-inner">
                        <p class="font-bold text-red-800 mb-2"><i class="fa-solid fa-hand-holding-medical"></i> คำแนะนำเบื้องต้น:</p>
                        <p class="mb-3">กรุณารอการติดต่อกลับจากเภสัชกรโดยเร็ว</p>
                        <p class="text-red-700 font-bold bg-white p-3 rounded-lg border border-red-100">
                            🚨 โปรดสังเกตอาการอย่างใกล้ชิด หากมีอาการรุนแรงกว่าเดิม หายใจลำบาก หรือหน้ามืด ให้รีบมาโรงพยาบาลทันที หรือโทร 1669 
                        </p>
                    </div>
                    <button onclick="liff.closeWindow()" class="w-full bg-slate-800 text-white text-xl font-bold py-4 rounded-xl shadow-md hover:bg-slate-900 transition">
                        ปิดหน้าต่าง
                    </button>
                `;
            } else {
                resultDiv.innerHTML = `
                    <div class="w-24 h-24 bg-green-100 text-green-600 rounded-full flex items-center justify-center text-5xl mx-auto mb-6 shadow-sm border-4 border-green-200">
                        <i class="fa-solid fa-shield-check"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-green-600 mb-4">ยังไม่พบอาการผิดปกติรุนแรง</h2>
                    <div class="text-slate-700 mb-6 text-lg text-left bg-green-50 p-5 rounded-xl border border-green-200 shadow-inner">
                        <p class="font-bold text-green-800 mb-2"><i class="fa-solid fa-pills"></i> คำแนะนำเบื้องต้น:</p>
                        <ul class="list-disc list-inside space-y-2">
                            <li>สามารถรับประทานยาตามที่แพทย์สั่งอย่างต่อเนื่องได้</li>
                            <li>โปรดหมั่นสังเกตอาการตนเอง หากมีอาการผิดปกติเกิดขึ้นสามารถกลับมาสแกนทำแบบประเมินนี้ได้อีกครั้ง</li>
                        </ul>
                    </div>
                    <button onclick="liff.closeWindow()" class="w-full bg-green-600 text-white text-xl font-bold py-4 rounded-xl shadow-md hover:bg-green-700 transition">
                        กลับสู่หน้าแชท
                    </button>
                `;
            }
            
            resultDiv.classList.add('step-active');
            document.getElementById('progressBar').style.width = '100%';
            window.scrollTo(0, 0); 
        }

        async function initializeLiff() {
            try {
                await liff.init({ liffId: MY_LIFF_ID });
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    document.getElementById('userName').innerText = "คุณ " + profile.displayName;
                    document.getElementById('userImage').src = profile.pictureUrl;
                    document.getElementById('userImage').classList.remove('hidden');
                    
                    const urlParams = new URLSearchParams(window.location.search);
                    const hn = urlParams.get('hn');
                    if(hn) {
                        patientHN = hn;
                        document.getElementById('displayHN').innerText = "HN: " + hn;
                    }
                } else {
                    liff.login();
                }
            } catch (err) {
                console.error('LIFF Error:', err);
                document.getElementById('userName').innerText = "ผู้ใช้งานระบบ";
            }
        }

        window.onload = () => {
            buildQuestionsUI();
            initializeLiff();
        };
    </script>
</body>
</html>
